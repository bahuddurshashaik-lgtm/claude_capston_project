<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        .form-group input, .form-group select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .hotels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .hotel-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .hotel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .hotel-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        .hotel-info {
            color: #666;
            margin-bottom: 5px;
        }
        .rating {
            color: #f39c12;
            font-weight: 600;
        }
        .price {
            font-size: 1.5em;
            color: #667eea;
            font-weight: 700;
            margin-top: 10px;
        }
        .amenities {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .amenity {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            color: #555;
        }
        .error {
            background: #fee;
            border: 2px solid #f88;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏨 Hotel Booking System</h1>
            <p>Search and book your perfect hotel</p>
        </div>

        <div class="card">
            <h2>Search Hotels</h2>
            <form class="search-form" id="searchForm">
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="e.g., Paris, London">
                </div>
                <div class="form-group">
                    <label for="minPrice">Min Price ($)</label>
                    <input type="number" id="minPrice" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="maxPrice">Max Price ($)</label>
                    <input type="number" id="maxPrice" placeholder="1000">
                </div>
                <div class="form-group">
                    <label for="minRating">Min Rating</label>
                    <select id="minRating">
                        <option value="">Any</option>
                        <option value="3">3+</option>
                        <option value="4">4+</option>
                        <option value="4.5">4.5+</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sortBy">Sort By</label>
                    <select id="sortBy">
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                        <option value="rating_asc">Rating: Low to High</option>
                        <option value="rating_desc">Rating: High to Low</option>
                    </select>
                </div>
                <div class="form-group" style="align-self: flex-end;">
                    <button type="submit" class="btn">Search Hotels</button>
                </div>
            </form>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/v1';

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const location = document.getElementById('location').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            const minRating = document.getElementById('minRating').value;
            const sortBy = document.getElementById('sortBy').value;

            const params = new URLSearchParams();
            if (location) params.append('location', location);
            if (minPrice) params.append('minPrice', minPrice);
            if (maxPrice) params.append('maxPrice', maxPrice);
            if (minRating) params.append('minRating', minRating);
            if (sortBy) params.append('sortBy', sortBy);

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">🔍 Searching hotels...</div>';

            try {
                const response = await fetch(`${API_URL}/hotels/search?${params}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Failed to fetch hotels');
                }

                if (data.data.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="card">
                            <p style="text-align: center; color: #666;">No hotels found. Try adjusting your search criteria.</p>
                        </div>
                    `;
                    return;
                }

                const hotelsHTML = data.data.map(hotel => `
                    <div class="hotel-card">
                        <div class="hotel-name">${hotel.name}</div>
                        <div class="hotel-info">📍 ${hotel.city}, ${hotel.country}</div>
                        <div class="hotel-info rating">⭐ ${hotel.rating}/5</div>
                        <div class="price">$${hotel.price_per_night}/night</div>
                        <div class="amenities">
                            ${hotel.amenities ? hotel.amenities.slice(0, 5).map(a => `<span class="amenity">${a}</span>`).join('') : ''}
                        </div>
                    </div>
                `).join('');

                resultsDiv.innerHTML = `
                    <div class="card">
                        <h2>Found ${data.data.length} Hotels</h2>
                    </div>
                    <div class="hotels-grid">
                        ${hotelsHTML}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                        <br><br>
                        <small>Make sure the API server is running at ${API_URL}</small>
                    </div>
                `;
            }
        });

        // Load some hotels on page load
        window.addEventListener('load', () => {
            document.getElementById('searchForm').dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
